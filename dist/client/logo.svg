<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c78c0"/>
      <stop offset="50%" stop-color="#2a5aa0"/>
      <stop offset="100%" stop-color="#1d4588"/>
    </linearGradient>
    <linearGradient id="goldVeinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77b"/>
      <stop offset="50%" stop-color="#d9af47"/>
      <stop offset="100%" stop-color="#b88a2e"/>
    </linearGradient>
  </defs>

  <!-- warm paper background tile keeps the logo usable on any page color -->
  <rect width="220" height="64" fill="#F9F5F0" rx="10"/>

  <!-- SY ring -->
  <circle cx="34" cy="32" r="22" fill="#F9F5F0" stroke="url(#ringGrad)" stroke-width="5"/>

  <!-- gold veins on the ring -->
  <g fill="none" stroke="url(#goldVeinGrad)" stroke-width="1.4" stroke-linecap="round" opacity="0.95">
    <path d="M14.5 17.5 Q20 14 24.5 17.5"/>
    <path d="M44 17.5 Q48 22 44 26.5"/>
    <path d="M14.5 46.5 Q20 50 24.5 46.5"/>
    <path d="M44 37.5 Q48 33 44 28.5"/>
    <path d="M24.5 12 Q20 8 16 12"/>
    <path d="M24.5 52 Q20 56 16 52"/>
    <path d="M30 12 Q33 9 36 12"/>
    <path d="M30 52 Q33 55 36 52"/>
  </g>

  <!-- white core behind the V so the V stays readable on the blue ring -->
  <circle cx="34" cy="32" r="14" fill="#F9F5F0"/>

  <!-- downward V inside the ring -->
  <path
    d="M24 28 L34 40 L44 28"
    fill="none"
    stroke="url(#ringGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- gold V accent -->
  <path
    d="M26 29.5 L34 38 L42 29.5"
    fill="none"
    stroke="url(#goldVeinGrad)"
    stroke-width="1.4"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.95"/>

  <!-- Secondary Yaza wordmark -->
  <text x="66" y="30" fill="#1C1917" font-family="Georgia, 'Cormorant Garamond', serif" font-size="19" font-weight="700" letter-spacing="1">Secondary</text>
  <text x="66" y="49" fill="url(#ringGrad)" font-family="Georgia, 'Cormorant Garamond', serif" font-size="15" font-weight="700" letter-spacing="3.5">YAZA</text>
</svg>
